      for(var j=0;j<o.attributes.length;j++)n.setAttribute(o.attributes[j].name,o.attributes[j].value);
      n.text=o.text;
      var listo=o.src?new Promise(function(r){n.onload=n.onerror=r;}):null;
      o.parentNode.replaceChild(n,o);
      if(listo)await listo;
    }
  }catch(e){m.textContent='🔒 No se pudo abrir el tablero ('+(e&&e.name||'error')+').';}
})();
</script>
